<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GNS3 Style Topology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; font-family: sans-serif; }
        #cy { width: 100vw; height: 100vh; display: block; }
        #title { position: absolute; top: 10px; left: 20px; z-index: 10; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="title"><h2>Netatlas</h2><p>Drag nodes to arrange.</p></div>
    <div id="cy"></div>

    <script>
        var elements = __ELEMENTS_JSON__;

        var cy = cytoscape({
            container: document.getElementById('cy'),
            elements: elements,
            style: [
                {
                    selector: 'node',
                    style: {
                        /* GNS3 Style Node */
                        'background-image': 'data(image)',
                        'background-fit': 'contain',
                        'background-color': 'transparent',
                        'border-width': 0,
                        'background-opacity': 0,
                        'width': 60,
                        'height': 60,
                        'label': 'data(label)',
                        'text-valign': 'bottom',
                        'text-halign': 'center',
                        'text-margin-y': 5,
                        'font-size': 12,
                        'font-weight': 'bold',
                        'text-wrap': 'wrap'
                    }
                },
                {
                    selector: 'node[status="offline"]',
                    style: { 'opacity': 0.4 }
                },
                {
                    selector: 'edge',
                    style: {
                        /* Geradlinige Verbindungen (Keine Ecken) */
                        'curve-style': 'straight',
                        'width': 2,
                        'line-color': '#999',

                        /* Labels direkt an den Routern (Source & Target) */
                        'source-label': 'data(sourceLabel)',
                        'target-label': 'data(targetLabel)',

                        /* Abstand der Labels vom Router-Icon (in Pixeln) */
                        'source-text-offset': 60,
                        'target-text-offset': 60,

                        /* Text ueber der Linie rotieren */
                        'edge-text-rotation': 'autorotate',
                        'text-margin-y': -10,
                        'font-size': 10,
                        'color': '#333',
                        'text-background-color': '#fff',
                        'text-background-opacity': 0.7,
                        'text-wrap': 'wrap'
                    }
                }
            ],
            layout: {
                name: 'cose',
                nodeDimensionsIncludeLabels: true,
                idealEdgeLength: 10000,
                nodeRepulsion: 800000,
                padding: 100,
                componentSpacing: 200
            }
        });
    </script>
</body>
</html>
